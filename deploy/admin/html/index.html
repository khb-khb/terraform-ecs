<html>

<head>
    <meta charset="UTF-8">
    <title>
        Admin Dashboard
    </title>
</head>

<body>
    <h1>
        admin page
    </h1>
    <img src="https://assets.kim-test.shop/admin/admin.png">
    <div>
        <h1>Admin Dashboard</h1>
    </div>
    <p> AWS Admin Page 입니다.</p>
    <button onclick="loadUploads()">업로드 목록 조회</button>

    <div id="uploads"></div>

    <script>
        async function loadUploads() {
            try {
                const res = await fetch("https://api.kim-test.shop/api/admin/uploads");
                const data = await res.json();

                if (!res.ok || data.status !== "ok") {
                    document.getElementById("uploads").innerText = "업로드 목록 조회 실패";
                    return;
                }

                const html = data.result.map(item => `
                    <div style="
                    border:1px solid #ddd;
    padding:20px;
    margin:20px 0;
    display:flex;
    align-items:center;
    gap:24px;
">


        <div>
            <p><b>계정명:</b> ${item.username}</p>
            <p><b>이메일:</b> ${item.email}</p>
            <p><b>업로드 시간:</b>
                ${new Date(item.created_at).toLocaleString("ko-KR")}
            </p>
        </div>
                <img src="${item.image_url}" style="
            width:220px;
            height:220px;
            object-fit:cover;
            border-radius:12px;
        ">
    </div>
            `).join("");

                document.getElementById("uploads").innerHTML = html || "업로드된 데이터가 없습니다.";
            } catch (err) {
                document.getElementById("uploads").innerText = "업로드 목록 조회 실패";
            }
        }
    </script>


</body>

</html>
