<html>

<head>
    <meta charset="UTF-8">
    <title>
        Admin Dashboard
    </title>
</head>

<body>
    <h1>
        admin page
    </h1>
    <img src="https://assets-s3-kimhb.s3.us-west-2.amazonaws.com/admin/admin.png">
    <div>
        <h1>Admin Dashboard</h1>
    </div>
    <p> AWS Admin Page 입니다.</p>
    <button onclick="checkDb()"> DB 조회 테스트 </button>
    <pre id="result"></pre>

    <script>
        async function checkDb() {
            try {
                const res = await fetch("https://api.kim-test.shop/api/admin/db-check");
                const data = await res.json();

                document.getElementById("result").innerText =
                    JSON.stringify(data, null, 2);
            } catch (err) {
                document.getElementById("result").innerText = "DB 조회 실패";
            }
        }
    </script>


</body>

</html>
