# api nginx 설정
server {
    listen 80;
    server_name api.kim-test.shop;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10M;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
}