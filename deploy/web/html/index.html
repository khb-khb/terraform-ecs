<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>
        WEB SERVICE
    </title>

    <style>
        h1 {
            font-size: 48px;
            margin-bottom: 12px;
        }

        p {
            color: #cbd5e1;
            margin-bottom: 24px;
        }

        img {
            width: 300px;
            border-radius: 12px;
            margin-bottom: 24px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>
    <div>
        <img src="https://assets.kim-test.shop/web/web.png">
        <h1>
            web page
        </h1>

        <input type="text" id="username" placeholder="계정명">
        <input type="email" id="email" placeholder="이메일">
        <input type="file" id="file" accept="image/*">
        <button onclick="uploadFile()">업로드</button>
        <button onclick="errorTest()">5XX 장애 테스트</button>

        <pre id="result"></pre>

        <script>
            async function uploadFile() {
                const username = document.getElementById("username").value;
                const email = document.getElementById("email").value;
                const file = document.getElementById("file").files[0];

                if (!username || !email || !file) {
                    document.getElementById("result").innerText =
                        "계정명, 이메일, 이미지 파일을 모두 입력해주세요.";
                    return;
                }

                const formData = new FormData();
                formData.append("username", username);
                formData.append("email", email);
                formData.append("file", file);

                try {
                    const response = await fetch("https://api.kim-test.shop/api/upload", {
                        method: "POST",
                        body: formData
                    });

                    const data = await response.json();

                    if (response.ok && data.status === "ok") {
                        document.getElementById("result").innerText = "업로드 완료";

                        document.getElementById("username").value = "";
                        document.getElementById("email").value = "";
                        document.getElementById("file").value = "";
                    } else {
                        document.getElementById("result").innerText = "업로드 실패";
                    }
                } catch (error) {
                    document.getElementById("result").innerText = "업로드 실패";
                }
            }


            async function errorTest() {
                try {
                    const response = await fetch("https://api.kim-test.shop/api/error-test");
                    const data = await response.json();

                    if (!response.ok) {
                        document.getElementById("result").innerText =
                            "5XX 장애 테스트 발생";
                        return;
                    }

                    document.getElementById("result").innerText =
                        JSON.stringify(data, null, 2);
                } catch (error) {
                    document.getElementById("result").innerText =
                        "장애 테스트 호출 실패";
                }
            }
        </script>
    </div>
</body>

</html>
