server {
    listen 80;
    server_name kim-test.shop www.kim-test.shop;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10M;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 500 'fail';
    }
}



